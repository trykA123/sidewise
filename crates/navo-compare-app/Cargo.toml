# The Sidewise desktop app: window shell, start screen, sessions and command line.
[package]
name = "navo-compare-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sidewise"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
futures = "0.3.34"
gpui-kit = "=0.9.1"
image = { version = "=0.25.10", default-features = false }
navo = { git = "https://github.com/trykA123/navo", rev = "231b49c2e55e30aef81d7e59f3e84329cebb1cb6", package = "navo-app" }
navo-compare-cli = { path = "../navo-compare-cli" }
navo-compare-profile = { path = "../navo-compare-profile" }
navo-core = { git = "https://github.com/trykA123/navo", rev = "231b49c2e55e30aef81d7e59f3e84329cebb1cb6" }
navo-ui = { git = "https://github.com/trykA123/navo", rev = "231b49c2e55e30aef81d7e59f3e84329cebb1cb6" }
resvg = "=0.49.0"
toml = "1.2.1"

[build-dependencies]
embed-resource = "3.0.12"
navo-compare-profile = { path = "../navo-compare-profile" }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
